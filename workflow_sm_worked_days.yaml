        #      flagged: true
    write: "dicke_cal/cal_nw/rmsfilter/{prev_stem}.gsh5"

  - function: lst_average
    params:
      use_nsamples: false
      use_flags: true
      use_resids: true
    write: "dicke_cal/cal_nw/rmsfilter/day-averaged.gsh5"

  - function: rfi_model_filter
    params:
      model: !Model
        model: polynomial
        offset: -2.5
        n_terms: 7
        transform: !ScaleTransform
          scale: 75.0
      threshold: 1.9
      max_iter: 1
      min_terms: 7
      max_terms: 7
      std_estimator: std
      
