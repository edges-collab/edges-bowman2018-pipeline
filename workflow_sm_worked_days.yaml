# the calobs we use here is created with the notebook:
#  /data4/smurray/Projects/radio/EOR/Edges/bayesian-calibration-paper-code/getting_2015_calibra2tion_with_better_lna_model.ipynb
# It is "v2", where the update over the first version is that it uses a high-term model
# but applied to the LNA S11 *already modelled* by Alan.
# The ant_s11_object is also created in this notebook and is a high-term linear model of
# Alan's already-modelled Antenna S11.

globals:
  calobs: /data4/nmahesh/edges/edges-field-levels/cal_files/2015_calobs_inject_lna_nw_v2.h5
  band: low
  s11_path: /data4/nmahesh/edges/code_from_alan_org/S11_blade_low_band_2015_342_03_14.txt.csv
  ant_s11_object: cal_files/2015_ants11_modelled.h5 

steps:
  - function: convert
    params:
       telescope_name: "EDGES-low2"
       telescope_location: 'alan-edges'
       name: "{year}_{day}"
    write: "{prev_stem}.gsh5"

    
#  We should use this, but Alan does not.
#  - function: add_weather_data
#  - function: add_thermlog_data
#    params:
#      band: low


# Here receiver_temp and ambient_hum come from weather/thermlog
# and Alan does not use it. There IS evidence that some receiver_temp
# values are like -1000000 which should probably be avoided in real life.
  - function: aux_filter
    params:
#      minima:
#        receiver_temp: 0      
      maxima:
        adcmax: 0.35
#        ambient_hum: 100
#        receiver_temp: 100

  - function: select_lsts
    params:
      lst_range: [6, 18]
      gha: true
      load: all
      use_alan_coordinates: true

  - function: power_percent_filter
    params:
      min_threshold: 0.7
      max_threshold: 3

  - function: dicke_calibration
    write: dicke_cal/{prev_stem}_dickecal.gsh5

  - function: approximate_temperature
    params:
      tload: 300
      tns: 1000

  - function: peak_orbcomm_filter
    params:
      threshold: 40

  - function: maxfm_filter
    params: 
      threshold: 200
  - function: rmsf_filter
    params:
      freq_range: [60,80]
      threshold: 200

  - function: lst_bin
    params:
      binsize: 12.0
      first_edge: 6.0
      max_edge: 18.0
      in_gha: true
      use_model_residuals: false

  - function: select_freqs
    params:
      freq_range: [40, 100]
    write: "dicke_cal/{prev_stem}_aux-filter.gsh5"

  # We do this INSTEAD of doing xRFI ourselves at this point
  - function: add_flags
    params:
      filt: alans-injected-flags
      flags: alans_rfi_gsflag/{name}.gsflag
      
  # Use this specially-crafted xRFI algorithm.
  # This is different in a few ways from the standard
  # model_filter, and these are listed in the docs for
  # the function. The main way is that it non-linearly
  # flags channels in a moving window, keeping them
  # for the next "slide" along.
#  - function: rfi_model_nonlinear_window_filter
#    name: rfi
#    params:
#      max_iter: 100
#      model: !Model
#        model: fourier
#        n_terms: 37
#        period: 1.5
#        transform: !ZerotooneTransform
#          range: [40.00244,100]
#      fit_kwargs:
#        method: alan-qrd
#      window_frac: 16
#      min_window_size: 10
#      threshold: 2.5
#      reflag_thresh: 1.0
#      watershed: 
#        1.0: 4
#        10.0: 8
#        100.0: 16
#    write: "dicke_cal/{prev_stem}_all-filter.gsh5"
  
  - function: gauss_smooth
    params:
      size: 8
      decimate_at: 0
      maintain_flags: 1
      flag_threshold: 0.25
      use_nsamples: true
    write: "dicke_cal/{prev_stem}_s.gsh5" 
 
  # CALIBRATION BLOCK
  - function: select_freqs
    name: downselect_50_to_100MHz
    params:
      freq_range: [50, 100]

  # The "invert" here means "keep" this frequency range.
  - function: flag_frequency_ranges
    params:
      freq_ranges:
        - - 51
          - 99
      invert: True
      
  - function: apply_noise_wave_calibration
    params:
      calobs: "{{ globals.calobs }}"
      band: "{{ globals.band }}"
      ant_s11_object: "{{ globals.ant_s11_object }}"
      tload: 300 
      tns: 1000
    write: dicke_cal/cal_nw/{prev_stem}_nw.gsh5
       
  - function: apply_loss_correction
    params:
      band: low
      antenna_correction: false
      balun_correction: true
      ground_correction: null
      calobs: "{{ globals.calobs }}"
      band: "{{ globals.band }}"
      s11_path: "{{ globals.s11_path }}"
      ambient_temp: 296
    write: dicke_cal/cal_nw/{prev_stem}_loss.gsh5

  - function: apply_beam_correction
    params:
      beam: /data4/nmahesh/edges/edges-field-levels/beam_factors/alan_newfc.h5
      freq_model: !Model
        model: fourier
        n_terms: 31
        transform: !ShiftTransform
          shift: 75.0
        period: 72 # This is 1.2 * the bandwidth
      resample_beam_lsts: false
      integrate_before_ratio: true
      use_beam_factor: True
      beam_file: /data4/nmahesh/edges/alans-pipeline/scripts/H2Case/beamcorr_{name}.txt
    write: dicke_cal/cal_nw/{prev_stem}_beam_alan_inject.gsh5


  - function: add_model
    name: three-term-physicallin
    params:
      model: !Model
        model: physicallin
        spectral_index: -2.5
        f_center: 75.0
        n_terms: 3
        with_cmb: false
    write: "dicke_cal/cal_nw/{prev_stem}_model.gsh5"
 
  - function: gauss_smooth
    name: gauss_smooth_after_cal
    params:
      size: 8
      nsmooth: 2
      decimate_at: 0
      maintain_flags: 9
      use_residuals: true
      use_nsamples: false
    write: "dicke_cal/cal_nw/{prev_stem}_s.gsh5"

  - function: add_model
    params:
      model: !Model
        model: physicallin
        spectral_index: -2.55
        f_center: 75.0
        n_terms: 5

  - function: explicit_day_filter
    params:
            flag_days:
                    - [2016,250]
