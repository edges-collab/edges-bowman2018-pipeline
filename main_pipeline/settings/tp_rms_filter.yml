- total_power_filter:
    bands: [[50, 100], [50, 75], [75, 100]]
    metric_model: !Model
      model: fourier
      n_terms: 40
      period: 48.0
    std_model: !Model
      model: fourier
      n_terms: 10
      period: 48.0
    threshold: 4
    
