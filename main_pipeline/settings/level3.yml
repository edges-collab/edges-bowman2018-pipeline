# The simplest settings for level3 mean we just average over days without explicitly
# doing any more filtering (or any averaging over frequency)
day_range: null
f_low: null
f_high: null
freq_resolution: null
gha_filter_file: null
xrfi_pipe:
       xrfi_model:
              n_signal: 7
              n_resid: 5
              threshold: 4
              max_iter: 7
              increase_order: false
              decrement_threshold: 0
              min_threshold: 3
              watershed: 4
       xrfi_watershed:
              tol: 0.7

n_threads: 32
