# How to filter out RFI
- rfi_model_filter:
    model: !Model
      model: linlog
      beta: -2.5
      max_iter: 15
      n_terms: 3
    increase_order: true
    threshold: 6
    decrement_threshold: 1
    min_threshold: 4
    min_terms: 4
    max_terms: 7
    n_resid: 3
    watershed: 4
    init_flags: [90., 100.0]

- rfi_watershed_filter:
    tol: 0.7

- negative_power_filter:
