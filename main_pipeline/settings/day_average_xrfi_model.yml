# The simplest settings for day averaging mean we just average over days without explicitly
# doing any more filtering (or any averaging over frequency)
day_range: null
ignore_days: null
gha_filter_file: null

xrfi_on_resids: false
xrfi_pipe:
  xrfi_model:
    model_type: linlog
    beta: -2.55
    max_iter: 15
    increase_order: true
    threshold: 2.5
    decrement_threshold: 0
    min_threshold: 2.5
    min_terms: 5
    max_terms: 7
    n_signal: 5
    n_resid: 3
    watershed: 4

  xrfi_watershed:
    tol: 0.7
    