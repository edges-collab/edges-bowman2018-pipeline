# The simplest settings for day averaging mean we just average over days without explicitly
# doing any more filtering (or any averaging over frequency)
day_range: null
ignore_days: null
gha_filter_file: null

xrfi_on_resids: true
xrfi_pipe:
  xrfi_model_sweep:
    which_bin: all
    watershed: 4
    max_iter: 15
    window_width: 400